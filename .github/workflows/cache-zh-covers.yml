name: Cache Chinese covers

on:
  push:
    branches: [main]
    paths:
      - "zh-books.js"
      - "scripts/cache-zh-covers.js"
      - ".github/workflows/cache-zh-covers.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cache:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISBN candidates
        run: node scripts/build-zh-isbn-data.js --online

      - name: Cache covers by ISBN
        run: node scripts/cache-zh-covers-by-isbn.js

      - name: Cache cover images
        run: node scripts/cache-zh-covers.js --report

      - name: Check site data
        run: node scripts/check-site.js --no-deploy

      - name: Audit cover data
        run: node scripts/audit-zh-covers.js

      - name: Commit cached covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zh-books.js covers/zh reports/cover-cache-status.json zh-data/zh-isbns.json
          if git diff --cached --quiet; then
            echo "No cover cache changes"
          else
            git commit -m "Cache Chinese book covers"
            git pull --rebase origin main
            git push
          fi

      - name: Check cover cache completeness
        run: node scripts/check-cover-cache.js --require-all

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
